name: Build & Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: NWjsAutomator-Windows-x64
            archive_ext: zip
          - os: macos-13
            artifact_name: NWjsAutomator-macOS-Intel
            archive_ext: zip
          - os: macos-latest
            artifact_name: NWjsAutomator-macOS-ARM64
            archive_ext: zip
          - os: ubuntu-latest
            artifact_name: NWjsAutomator-Linux-x64
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: python -m PyInstaller nwjs_automator.spec --noconfirm

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/NWjsAutomator/* -DestinationPath "${{ matrix.artifact_name }}.zip"
        shell: pwsh

      - name: Create archive (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -r "../${{ matrix.artifact_name }}.zip" NWjsAutomator.app || zip -r "../${{ matrix.artifact_name }}.zip" NWjsAutomator/

      - name: Create archive (Linux)
        if: runner.os == 'Linux'
        run: cd dist && tar czf "../${{ matrix.artifact_name }}.tar.gz" NWjsAutomator/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
